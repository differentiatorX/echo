[project]
name = "hookcut"
version = "0.1.0"
description = "Turn long YouTube videos into the few Reels that actually hit. Claude picks, real audience data confirms."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Madhur Mittal", email = "noreply@github.com" }]
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1.0",
  "opencv-python-headless>=4.9",
  "scenedetect>=0.6.4",
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "requests>=2.31",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hookcut = "hookcut.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hookcut"]
