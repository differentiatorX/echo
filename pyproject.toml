[project]
name = "echoclip"
version = "0.1.0"
description = "Long video in, the few Reels that echo. Your AI agent picks the moments, real audience data confirms them."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Madhur Mittal", email = "noreply@github.com" }]
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[default]>=2025.11.12",
  "faster-whisper>=1.1.0",
  "opencv-python-headless>=4.9,<5",
  "scenedetect>=0.6.4",
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "requests>=2.31",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
echoclip = "echoclip.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echoclip"]
